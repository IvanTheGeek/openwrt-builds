# Estate baseline. Key-only from first boot; dropbear stays on :2222 as break-glass.
# UsePAM is deliberately ABSENT: openssh-server here is a non-PAM build, sshd warns
# "Unsupported option UsePAM" but `sshd -t` still passes, so the gate would not catch it.
Port 22
PermitRootLogin prohibit-password
PasswordAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey
